services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      FRONTEND_URL: http://localhost:5050
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_URL: http://localhost:9000
    depends_on:
      mongodb:
        condition: service_started
      db_migration:
        condition: service_completed_successfully


  db_migration:
    build:
      context: .
      dockerfile: Dockerfile
    command: python scripts/create_indexes.py
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017
    depends_on:
      - mongodb


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        PUBLIC_CLIENT_SIDE_API_BASE_URL: http://localhost:8080/api
        PUBLIC_SERVER_SIDE_API_BASE_URL: http://backend:8080/api
    ports:
      - "5050:5050"
    env_file:
      - .env
    environment:
      PORT: 5050
      ORIGIN: http://localhost:5050


  mongodb:
    image: mongo:7.0
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db


  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3


volumes:
  mongodb_data:
  minio_data: