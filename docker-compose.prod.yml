services:
  # --- GATEWAY ---
  nginx:
    image: nginx:alpine
    container_name: mypage48-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - backend
      - frontend
    restart: always
    networks:
      - public_net

  # --- BACKEND ---
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mypage48-backend
    volumes:
      - ./logs/backend:/var/log/mypage48
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017
      ENV: ${ENV:-prod}
    depends_on:
      mongodb:
        condition: service_started
      db_migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    networks:
      - public_net
      - internal_net

  db_migration:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mypage48-migration
    command: python scripts/create_indexes.py
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017
    depends_on:
      - mongodb
    networks:
      - internal_net

  # --- FRONTEND ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        PUBLIC_CLIENT_SIDE_API_BASE_URL: ${PUBLIC_CLIENT_SIDE_API_BASE_URL}
        PUBLIC_SERVER_SIDE_API_BASE_URL: http://backend:8080/api
        PUBLIC_UMAMI_WEBSITE_ID: ${PUBLIC_UMAMI_WEBSITE_ID}
        PUBLIC_UMAMI_URL: ${PUBLIC_UMAMI_URL}
    container_name: mypage48-frontend
    env_file:
      - .env
    environment:
      PORT: 5050
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5050/health', (r) => { if (r.statusCode !== 200) process.exit(1); })"]
      interval: 60s
      timeout: 10s
      retries: 3
    restart: always
    networks:
      - public_net

  # --- DATABASES & STORAGE ---
  mongodb:
    image: mongo:7.0
    container_name: mypage48-mongodb
    ports:
      - "127.0.0.1:27017:27017" # Securely exposed for SSH Tunnel
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    restart: always
    networks:
      - internal_net

  minio:
    image: minio/minio:latest
    container_name: mypage48-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    networks:
      - public_net
      - internal_net

  # --- ANALYTICS ---
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: mypage48-umami
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-umami:5432/${POSTGRES_DB}
      APP_SECRET: ${UMAMI_SECRET}
    depends_on:
      - db-umami
    restart: always
    networks:
      - public_net
      - internal_net

  db-umami:
    image: postgres:15-alpine
    container_name: mypage48-db-umami
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - umami_data:/var/lib/postgresql/data
    restart: always
    networks:
      - internal_net

  # --- AUTOMATION ---
  scraper-cron:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mypage48-scraper-cron
    command: /app/scripts/scraper-cron.sh
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017
    depends_on:
      - mongodb
    restart: always
    networks:
      - internal_net

networks:
  public_net:
    driver: bridge
  internal_net:
    driver: bridge

volumes:
  mongodb_data:
  minio_data:
  umami_data:
