# MyPage48 Production Nginx Configuration
# Optimized for performance (Gzip, HTTP/2, Caching)

# Gzip Compression
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
gzip_min_length 1000;

# Common SSL settings
ssl_certificate /etc/letsencrypt/live/mypage48.com/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/mypage48.com/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers HIGH:!aNULL:!MD5;

# Common proxy headers
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 300s;
proxy_connect_timeout 300s;
proxy_send_timeout 300s;
client_max_body_size 100M;

# --- HTTP to HTTPS Redirect ---
server {
    listen 80;
    server_name mypage48.com api.mypage48.com analytics.mypage48.com storage.mypage48.com;

    # Handle Certbot Challenge (Just in case)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- MAIN APP (mypage48.com) ---
server {
    listen 443 ssl http2;
    server_name mypage48.com;

    # Massive buffer for large headers
    proxy_buffer_size 1m;
    proxy_buffers 4 1m;
    proxy_busy_buffers_size 1m;
    large_client_header_buffers 4 1m;



    location /api/admin/replay/upload {
        proxy_pass http://backend:8080;
        client_max_body_size 50M;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        client_max_body_size 10M;
    }

    # Static assets caching (SvelteKit immutable assets)
    location /_app/immutable/ {
        proxy_pass http://frontend:5050;
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://frontend:5050;
    }
}

# --- API (api.mypage48.com) ---
server {
    listen 443 ssl http2;
    server_name api.mypage48.com;

    location /admin/replay/upload {
        proxy_pass http://backend:8080/api/admin/replay/upload;
        client_max_body_size 50M;
    }

    location / {
        proxy_pass http://backend:8080/api/;
        client_max_body_size 10M;
    }
}

# --- ANALYTICS (analytics.mypage48.com) ---
server {
    listen 443 ssl http2;
    server_name analytics.mypage48.com;

    location / {
        proxy_pass http://umami:3000;
    }
}

