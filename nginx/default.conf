# MyPage48 Production Nginx Configuration (Cloudflare Origin SSL)

# Common SSL settings
ssl_certificate /etc/letsencrypt/live/mypage48.com/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/mypage48.com/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers HIGH:!aNULL:!MD5;

# Common proxy headers
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Increase buffer sizes to avoid 'upstream sent too big header' error
proxy_buffer_size 128k;
proxy_buffers 4 256k;
proxy_busy_buffers_size 256k;

# --- HTTP to HTTPS Redirect ---
server {
    listen 80;
    server_name mypage48.com api.mypage48.com analytics.mypage48.com storage.mypage48.com;

    # Handle Certbot Challenge (Just in case)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- MAIN APP (mypage48.com) ---
server {
    listen 443 ssl;
    server_name mypage48.com;

    location /api/ {
        proxy_pass http://backend:8080;
        client_max_body_size 10M;
    }

    location / {
        proxy_pass http://frontend:5050;
    }
}

# --- API (api.mypage48.com) ---
server {
    listen 443 ssl;
    server_name api.mypage48.com;

    location / {
        proxy_pass http://backend:8080/api/;
        client_max_body_size 10M;
    }
}

# --- ANALYTICS (analytics.mypage48.com) ---
server {
    listen 443 ssl;
    server_name analytics.mypage48.com;

    location / {
        proxy_pass http://umami:3000;
    }
}

# --- STORAGE (storage.mypage48.com) ---
server {
    listen 443 ssl;
    server_name storage.mypage48.com;

    location / {
        proxy_pass http://minio:9001;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
