# MyPage48 Production Nginx Configuration

# Common settings for proxying
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Main Application (mypage48.com)
server {
    listen 80;
    server_name mypage48.com;

    # Handle Certbot Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy /api/ requests to backend (preserving the /api path)
    location /api/ {
        proxy_pass http://backend:8080;
        client_max_body_size 10M;
    }

    # Proxy all other requests to frontend
    location / {
        proxy_pass http://frontend:5050;
    }
}

# API Subdomain (api.mypage48.com)
server {
    listen 80;
    server_name api.mypage48.com;

    # Handle Certbot Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # Map api.domain.com/login -> backend:8080/api/login
        # We append /api/ here so the user sees a "Pretty URL" 
        # (https://api.mypage48.com/login) while the backend gets what it needs.
        proxy_pass http://backend:8080/api/;
        client_max_body_size 10M;
    }
}

# Analytics Subdomain (analytics.mypage48.com)
server {
    listen 80;
    server_name analytics.mypage48.com;

    location / {
        proxy_pass http://umami:3000;
    }
}

# Storage Subdomain (storage.mypage48.com)
server {
    listen 80;
    server_name storage.mypage48.com;

    location / {
        proxy_pass http://minio:9001;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
