<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
		<meta name="google-site-verification" content="6TNLz82OFcXfZkiS7_07d1A51GwM4z9gjcBnOM2fbVw" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap"
			rel="stylesheet"
		/>
		<script>
			// Fix malformed URIs (naked % characters) on the client side before SvelteKit starts
			if (window.location.pathname.includes('%')) {
				try {
					decodeURI(window.location.pathname);
				} catch (e) {
					const newPath = window.location.pathname.replace(/%(?![0-9a-fA-F]{2})/g, '%25');
					window.history.replaceState(
						null,
						'',
						newPath + window.location.search + window.location.hash
					);
				}
			}

			(function () {
				const theme = localStorage.getItem('mypage48_theme') || 'auto';
				let isDark = false;
				if (theme === 'dark') {
					isDark = true;
				} else if (theme === 'auto') {
					isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
				}
				if (isDark) {
					document.documentElement.classList.add('dark');
				}
			})();
		</script>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
