name: Production Deployment

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      recorder48: ${{ steps.check.outputs.recorder48 }}
      mypage48: ${{ steps.check.outputs.mypage48 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for changes
        id: check
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found, defaulting to true for both."
            echo "recorder48=true" >> $GITHUB_OUTPUT
            echo "mypage48=true" >> $GITHUB_OUTPUT
          else
            echo "Comparing HEAD with previous tag: $PREV_TAG"
            
            # Check for recorder changes
            if git diff --name-only $PREV_TAG HEAD | grep -q '^recorder/'; then
              echo "Changes detected in recorder directory."
              echo "recorder48=true" >> $GITHUB_OUTPUT
            else
              echo "No changes in recorder directory."
              echo "recorder48=false" >> $GITHUB_OUTPUT
            fi
            
            # Check for main app changes (anything that is NOT inside recorder/)
            if git diff --name-only $PREV_TAG HEAD | grep -qv '^recorder/'; then
              echo "Changes detected in main app (outside recorder directory)."
              echo "mypage48=true" >> $GITHUB_OUTPUT
            else
              echo "No changes in main app."
              echo "mypage48=false" >> $GITHUB_OUTPUT
            fi
          fi

  deploy-mypage48:
    needs: check-changes
    if: needs.check-changes.outputs.mypage48 == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mypage48.com
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.REMOTE_TARGET }}
            git fetch --all --tags
            git checkout ${{ github.ref_name }}
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f

  deploy-recorder48:
    needs: check-changes
    if: needs.check-changes.outputs.recorder48 == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Deploy Recorder to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.RECORDER_HOST }}
          username: ${{ secrets.RECORDER_USER }}
          key: ${{ secrets.RECORDER_SSH_KEY }}
          script: |
            cd ${{ secrets.RECORDER_TARGET }}
            git fetch --all --tags
            git checkout ${{ github.ref_name }}
            cd recorder
            .venv/bin/pip install -r requirements.txt
            sudo systemctl restart mypage48-record
            sudo systemctl restart mypage48-upload
            sudo systemctl restart mypage48-theater
            
            sleep 2
            sudo systemctl status mypage48-record --no-pager
            sudo systemctl status mypage48-upload --no-pager
            sudo systemctl status mypage48-theater --no-pager
